[package]
name = "scryfall_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
chrono = "0.4.43"
http-body-util = { version = "0.1.3", features = ["full"] }
hyper = { version = "1.8.1", features = ["full"] }
loadenv = "0.1.4"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = "0.12.5"
tokio = {version = "1.49.0", features = ["full"]}
uuid = { version = "1.21.0", features = ["v4", "v7", "v8"] }
